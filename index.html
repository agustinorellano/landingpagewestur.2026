  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0d2518;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 20px;color:#fff}
  .logo{margin-bottom:48px}
  .logo img{height:52px;width:auto;filter:brightness(0) invert(1);opacity:.9}
  .card{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:20px;padding:48px 40px;max-width:480px;width:100%;text-align:center;backdrop-filter:blur(12px)}
  .icon{width:56px;height:56px;margin:0 auto 28px;background:rgba(255,255,255,.08);border-radius:50%;display:flex;align-items:center;justify-content:center}

  h1{font-size:22px;font-weight:700;color:#fff;margin-bottom:12px;letter-spacing:-.2px}
  p{font-size:15px;color:rgba(255,255,255,.6);line-height:1.6;margin-bottom:32px}
  .divider{width:40px;height:2px;background:linear-gradient(90deg,#2d7a50,#7ec8a0);border-radius:2px;margin:0 auto 28px}
  .contact{display:flex;flex-direction:column;gap:12px}
  .contact a{display:flex;align-items:center;justify-content:center;gap:10px;padding:13px 20px;border-radius:12px;font-size:14px;font-weight:500;text-decoration:none;transition:background .18s}
  .wa{background:#25D366;color:#fff}
  .wa:hover{background:#1fb855}
  .wa svg{width:18px;height:18px;fill:#fff;flex-shrink:0}
  .mail{background:rgba(255,255,255,.08);color:rgba(255,255,255,.85);border:1px solid rgba(255,255,255,.12)}
  .mail:hover{background:rgba(255,255,255,.13)}
  .mail svg{width:17px;height:17px;stroke:rgba(255,255,255,.7);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
  .footer{margin-top:40px;font-size:12px;color:rgba(255,255,255,.25)}
  @media(max-width:480px){.card{padding:36px 24px}h1{font-size:20px}}
